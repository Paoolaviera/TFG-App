<ion-header>
  <ion-toolbar>
    <ion-title>Producto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Añadir producto agrícola</ion-card-title>
      <ion-card-subtitle>
        Registra la información necesaria para planificar el suministro.
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Nombre del producto</ion-label>
        <ion-input type="text"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Descripción</ion-label>
        <ion-textarea rows="4"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Cantidad disponible</ion-label>
        <ion-input type="number"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label>Unidad</ion-label>
        <ion-select placeholder="Selecciona unidad">
          <ion-select-option value="kg">Kg</ion-select-option>
          <ion-select-option value="cajas">Cajas</ion-select-option>
          <ion-select-option value="unidades">Unidades</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Precio por unidad</ion-label>
        <ion-input type="number"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Fecha de disponibilidad</ion-label>
        <ion-input type="date"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Código de lote</ion-label>
        <ion-input type="text"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label>Estado</ion-label>
        <ion-select value="disponible">
          <ion-select-option value="disponible">Disponible</ion-select-option>
          <ion-select-option value="reservado">Reservado</ion-select-option>
          <ion-select-option value="agotado">Agotado</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-button expand="block" class="save-button" routerLink="/panel-agricultor">
        Guardar producto
      </ion-button>

      <ion-button expand="block" fill="clear" routerLink="/panel-agricultor">
        Cancelar
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
